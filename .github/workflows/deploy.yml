name: Deploy to GitHub Pages

# The ONLY deployer for this site. Used by BOTH FOH repos (robertos-foh-dev and
# robertos-foh) -- the header used to say "DEV REPO ONLY", which was wrong and
# cost a live deploy on 28 Jul 2026. See the warning below.
# - Skips the legacy Jekyll build (this is a plain static site, no build step).
# - Publishes the whole repo as-is.
# - The green check on this run = the site is actually live on the CDN.
#
# WHY THIS MUST BE THE ONLY DEPLOYER. Pages will run the legacy Jekyll builder
# AND this workflow if the repo's Pages setting is `build_type: legacy`, and the
# two race for the same deployment slot. On 28 Jul the live repo was in exactly
# that state: two pushes 8 minutes apart, and the second one died with
#   "Deployment request failed ... due to in progress deployment.
#    Please cancel <previous sha> first or wait for it to complete."
# The push succeeded, the commit was on main, raw.githubusercontent.com served
# the new file -- and the live SITE served the previous build indefinitely. It
# does not recover on its own; it needs a re-run from the Actions tab.
#
# Both repos are now set to `build_type: workflow`, so this file is the single
# deployer. That removed one of the two ways a deploy could strand; the other
# one -- and the one that actually bit -- is the concurrency setting below.
#
# IF A DEPLOY EVER SILENTLY STRANDS AGAIN, in this order:
#   1. Actions tab -> is the latest run red with "in progress deployment"?
#      Re-run it. The site does NOT recover on its own.
#   2. Settings -> Pages -> Source must be "GitHub Actions", not a branch.
#   3. Only then look at the code.
# A push is not a deploy. Always check the served bytes, not git.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you re-deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# QUEUE deploys, never cancel one. This line is the actual cause of the 28 Jul
# incident and it is counter-intuitive, so do not "tidy" it back.
#
# With cancel-in-progress: true, a second push cancels the first WORKFLOW RUN --
# but the Pages DEPLOYMENT that run already created keeps going on GitHub's
# side. The new run then asks for a deployment slot and is refused:
#   "Deployment request failed ... due to in progress deployment.
#    Please cancel <previous sha> first or wait for it to complete."
# The run goes red, the push looks perfect from the command line, and the SITE
# silently keeps serving the previous build until somebody re-runs it by hand.
# Verified on 28 Jul: it happened on the live repo AND then, with only this
# workflow deploying, on dev too -- so it is this setting, not the old
# legacy-Jekyll-versus-workflow race.
#
# false = the second run waits for the first deployment to finish, then goes.
# Slightly slower, and it always arrives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (whole repo, no Jekyll)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
