name: Deploy to GitHub Pages

# The ONLY deployer for this site. Used by BOTH FOH repos (robertos-foh-dev and
# robertos-foh) -- the header used to say "DEV REPO ONLY", which was wrong and
# cost a live deploy on 28 Jul 2026. See the warning below.
# - Skips the legacy Jekyll build (this is a plain static site, no build step).
# - Publishes the whole repo as-is.
# - The green check on this run = the site is actually live on the CDN.
#
# WHY THIS MUST BE THE ONLY DEPLOYER. Pages will run the legacy Jekyll builder
# AND this workflow if the repo's Pages setting is `build_type: legacy`, and the
# two race for the same deployment slot. On 28 Jul the live repo was in exactly
# that state: two pushes 8 minutes apart, and the second one died with
#   "Deployment request failed ... due to in progress deployment.
#    Please cancel <previous sha> first or wait for it to complete."
# The push succeeded, the commit was on main, raw.githubusercontent.com served
# the new file -- and the live SITE served the previous build indefinitely. It
# does not recover on its own; it needs a re-run from the Actions tab.
#
# Both repos are now set to `build_type: workflow`, so this file is the single
# deployer and that race cannot happen. If a deploy ever silently strands
# again, check that setting FIRST (Settings -> Pages -> Source = GitHub
# Actions), before looking at the code.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you re-deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; if a newer push comes in, drop the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (whole repo, no Jekyll)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
