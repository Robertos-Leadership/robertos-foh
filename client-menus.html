<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roberto's — Menus for your occasion</title>
<link rel="stylesheet" href="client-brand.css">
<style>
  body{margin:0;background:var(--page);font-family:var(--font-body);color:var(--ink)}
  .wrap{max-width:520px;margin:0 auto;padding:18px 14px 40px}
  .card{background:var(--paper);border:1px solid var(--line-soft);border-radius:16px;overflow:hidden}
  .brand{text-align:center;padding:26px 20px 20px}
  .brand img{display:block;width:min(250px,64%);height:auto;margin:0 auto}
  .sub{font-size:14px;color:var(--ink-soft);text-align:center}
  .sub2{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:3px;font-family:var(--font-body)}
  .sect{border-top:1px solid var(--line-soft);margin:18px 22px 0;padding-top:14px}
  .sect-t{text-align:center;font-size:11px;letter-spacing:3px;color:var(--warn);text-transform:uppercase;margin-bottom:10px;font-family:var(--font-body)}
  .item{padding:9px 0}
  .item + .item{border-top:1px solid var(--page)}
  .nm{font-size:14.5px;color:var(--vino)}
  .pr{font-size:12px;color:var(--ink-soft);font-family:var(--font-body);margin-top:2px}
  .ds{font-size:11.5px;color:var(--ink-soft);display:block;margin-top:4px;line-height:1.55}
  .open{display:inline-block;background:var(--vino);color:var(--sabbia);padding:8px 22px;border-radius:20px;text-decoration:none;font-size:12.5px;letter-spacing:1px;margin-top:9px}
  .btnrow{padding:20px 22px 26px}
  .ft{text-align:center;font-size:10.5px;color:var(--ink-faint);margin-top:12px;line-height:1.7;font-family:var(--font-body)}
  .msg{text-align:center;padding:60px 24px;font-size:14px;color:var(--ink-mid)}
  .nm,.dish,.sect-h,.cath,.h2,.total,.sub{font-family:var(--font-display)}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card">
  <div class="msg">Loading…</div>
</div></div>
<script>
var SUPA = 'https://paoaivwtkzujmrgrfjuq.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhb2Fpdnd0a3p1am1yZ3JmanVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNzAxMzAsImV4cCI6MjA5NjY0NjEzMH0.VynG9PBeIaqRG2lkMEuzskkcB11EhR-UfO9eGYsaUxk';
var q = new URLSearchParams(location.search);
// Only well-formed keys/ids ever reach the query string of the API call — the
// guest's URL must never be able to steer the filter.
function clean(list, re){
  return (list||'').split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s && re.test(s); });
}
var foodKeys = clean(q.get('food'), /^[a-z0-9-]{1,60}$/i);
var bevIds   = clean(q.get('bev'),  /^[0-9a-f-]{36}$/i);
var who      = (q.get('n')||'').slice(0, 40).trim();
// Minimum-spend clients are sent the menu WITHOUT prices — the price lives in the
// proposal / contract, not on this page.
var noPrice  = q.get('np')==='1';
// À la carte dishes Valentina ticked, and the token their picks come back on.
// alc=all is the whole à la carte — one short link Valentina can copy and
// paste, instead of a URL carrying fifty-five ids.
var alcAll   = (q.get('alc')||'') === 'all';
var alcIds   = clean(q.get('alc'), /^[0-9a-f-]{36}$/i);
var pickTok  = (q.get('pick')||'').replace(/[^a-zA-Z0-9]/g,'').slice(0,64);
var picked   = {};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(id){ return document.getElementById(id); }
function money(n){ return (n==null||isNaN(n)) ? '' : Number(n).toLocaleString('en-US'); }
function fail(msg){ el('card').innerHTML = '<div class="brand"><img src="robertos-logo-wordmark.svg" alt="Roberto’s"></div><div class="msg">'+esc(msg)+'</div>'; }
function inList(a){ return 'in.(' + a.map(function(x){ return '"'+x+'"'; }).join(',') + ')'; }

function secLabel(x){
  var MINOR={e:1,di:1,del:1,della:1,la:1,le:1,il:1,al:1,alla:1,allo:1,con:1,da:1,dal:1,nostra:1,nostro:1,'in':1,a:1};
  return String(x||'').toLowerCase().split(/\s+/).map(function(w,i){
    if(i && MINOR[w]) return w;
    return w.replace(/^([a-zà-ÿ])/, function(m,c){ return c.toUpperCase(); });
  }).join(' ');
}
function priceText(a){
  if(a.tiers && a.tiers.length) return a.tiers.map(function(t){ return t.size+' AED '+money(t.price); }).join(' · ');
  if(a.market_price) return 'Market price';
  if(a.price==null) return '';
  return 'AED '+money(a.price)+(a.unit==='per piece' ? ' per piece' : '');
}
function tick(cb){
  var id = cb.getAttribute('data-alc');
  if(cb.checked) picked[id]=true; else delete picked[id];
  var n = Object.keys(picked).length;
  var btn = el('alc-send'), msg = el('alc-msg');
  if(btn) btn.disabled = !n;
  if(msg) msg.textContent = n ? (n+' dish'+(n>1?'es':'')+' chosen — send them whenever you are ready.') : 'Tick a dish to send your choices.';
}
// The picks go straight into event_menu_choices, which accepts an anonymous
// insert — no server of our own in the way. Valentina sees them in the app.
async function sendPicks(){
  var ids = Object.keys(picked);
  if(!ids.length) return;
  var btn = el('alc-send'), msg = el('alc-msg');
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  var names = (window.__alc||[]).filter(function(a){ return picked[a.id]; }).map(function(a){ return a.name; });
  try{
    var r = await fetch(SUPA+'/rest/v1/event_menu_choices', {
      method:'POST',
      headers:{ apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json', Prefer:'return=minimal' },
      body: JSON.stringify({
        token: pickTok || 'alc-no-token',
        menu_key: 'alacarte',
        choices: { alacarte_ids: ids, dishes: names,
                   guest: ((el('alc-who')&&el('alc-who').value.slice(0,60).trim()) || who || null) },
        note: (el('alc-note')&&el('alc-note').value.slice(0,900)) || null
      })
    });
    if(!r.ok) throw new Error(r.status);
    if(btn) btn.style.display='none';
    if(msg){ msg.style.color='var(--ok)'; msg.innerHTML='Grazie! Your choices are with us.<br>Valentina will come back to you shortly.'; }
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Send my choices to Roberto’s'; }
    if(msg){ msg.style.color='var(--err)'; msg.textContent='That did not send — please try once more, or simply reply to Valentina.'; }
  }
}

async function get(path){
  var r = await fetch(SUPA+'/rest/v1/'+path, { headers:{ apikey:KEY, Authorization:'Bearer '+KEY } });
  if(!r.ok) throw new Error(r.status);
  return await r.json();
}

async function load(){
  if(!foodKeys.length && !bevIds.length && !alcIds.length && !alcAll){
    return fail('This link is incomplete — please use the link Roberto’s sent you, or get in touch and we’ll resend it.');
  }
  // Fetch beverage packages asking for the pdf column, but fall back to the older
  // column set if the pdf field isn't on the view yet — so an existing link never
  // breaks in the window between deploying this page and running the SQL.
  async function getBevs(){
    if(!bevIds.length) return [];
    try{ return await get('event_bev_public?id='+inList(bevIds)+'&select=id,name,duration_hours,price_pp,includes,pdf'); }
    catch(e){ return await get('event_bev_public?id='+inList(bevIds)+'&select=id,name,duration_hours,price_pp,includes'); }
  }
  try{
    var res = await Promise.all([
      // event_bev_public is the guest-safe view: name, hours, price and what's
      // included. Our cost per guest lives on the base table and never leaves it.
      foodKeys.length ? get('event_set_menus?key='+inList(foodKeys)+'&active=is.true&select=key,name,price_pp,line,pdf') : [],
      getBevs(),
      (alcAll || alcIds.length)
        ? get('event_alacarte?'+(alcAll ? '' : 'id='+inList(alcIds)+'&')+'active=is.true&select=id,section,name,description,price,unit,tiers,market_price,allergens,sort_order&order=sort_order')
        : []
    ]);
    render(res[0]||[], res[1]||[], res[2]||[]);
  }catch(e){
    fail('Could not load the menus — please check your connection and reopen the link.');
  }
}

function render(menus, bevs, alc){
  alc = alc || [];
  window.__alc = alc;
  if(!menus.length && !bevs.length && !alc.length){
    return fail('These menus are no longer available — please get in touch and we’ll help right away.');
  }
  // Keep the order Valentina ticked them in, not whatever the database returns.
  menus.sort(function(a,b){ return foodKeys.indexOf(a.key) - foodKeys.indexOf(b.key); });
  bevs.sort(function(a,b){ return bevIds.indexOf(a.id) - bevIds.indexOf(b.id); });

  var both = (menus.length || alc.length) && bevs.length;
  var h = '<div class="brand"><img src="robertos-logo-wordmark.svg" alt="Roberto’s"></div>'+
    '<div class="sub">'+(
      (menus.length && alc.length) ? 'Menus &amp; our à la carte'
      : both ? 'Menus &amp; beverage packages'
      : menus.length ? 'Our set menus'
      : alc.length ? 'Our à la carte'
      : 'Beverage packages')+'</div>'+
    '<div class="sub2">'+(who ? 'For '+esc(who)+' · ' : '')+'DIFC, Dubai — private dining &amp; events</div>';

  if(menus.length){
    h += '<div class="sect">'+(both ? '<div class="sect-t">The food — set menus</div>' : '')+
      menus.map(function(m){
        // A designed PDF opens as the menu; a chef-added menu opens its own
        // page, which prints the courses in full. Either way: one tap.
        var href = m.pdf ? (/^https?:/i.test(m.pdf) ? m.pdf : m.pdf)
                         : 'client-setmenu.html?m='+encodeURIComponent(m.key);
        return '<div class="item"><div class="nm">'+esc(m.name)+'</div>'+
          ((noPrice || m.price_pp==null) ? '' : '<div class="pr">AED '+money(m.price_pp)+' per guest</div>')+
          (m.line ? '<span class="ds">'+esc(m.line)+'</span>' : '')+
          '<a class="open" href="'+esc(href)+'" target="_blank" rel="noopener">View the full menu</a></div>';
      }).join('')+'</div>';
  }

  if(alc.length){
    // Grouped the way the menu is printed, each dish with its English
    // description and allergens — and a tick, so the guest can tell us what
    // they would like rather than writing it out in a reply.
    alc.sort(function(a,b){ return (a.sort_order||999)-(b.sort_order||999); });
    var secs = [];
    alc.forEach(function(a){ if(secs.indexOf(a.section)<0) secs.push(a.section); });
    h += '<div class="sect">'+(both||menus.length ? '<div class="sect-t">À la carte</div>' : '')+
      '<div class="hint" style="text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:8px">Tick anything you would like and send it back to us.</div>'+
      secs.map(function(sname){
        return '<div class="sect-t" style="margin-top:14px">'+esc(secLabel(sname))+'</div>'+
          alc.filter(function(a){ return a.section===sname; }).map(function(a){
            var pr = noPrice ? '' : priceText(a);
            return '<label class="item" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">'+
              '<input type="checkbox" data-alc="'+esc(a.id)+'" onchange="tick(this)" style="accent-color:var(--vino);margin-top:4px">'+
              '<span style="flex:1"><span class="nm">'+esc(a.name)+
                ((a.allergens&&a.allergens.length)?' <span class="codes" style="font-size:10px;color:var(--ink-faint)">('+a.allergens.join(')(')+')</span>':'')+'</span>'+
              (pr?'<div class="pr">'+esc(pr)+'</div>':'')+
              (a.description?'<span class="ds">'+esc(a.description)+'</span>':'')+'</span></label>';
          }).join('');
      }).join('')+
      // Without this the choices arrive as "A guest" and nobody can tell whose
      // they are -- the name only ever came from an &n= in the link, and the
      // a la carte link is copied without one.
      '<div style="margin-top:14px"><input id="alc-who" value="'+esc(who||'')+'" placeholder="Your name, so we know whose choices these are" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;font-family:var(--font-body);font-size:13px"></div>'+
      '<div style="margin-top:10px"><textarea id="alc-note" placeholder="Anything we should know? Allergies, the occasion, a dish you cannot see here…" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;font-family:var(--font-body);font-size:13px;min-height:60px"></textarea></div>'+
      '<div style="margin-top:10px"><button id="alc-send" onclick="sendPicks()" style="width:100%;background:var(--vino);color:var(--sabbia);border:none;border-radius:9px;padding:13px;font-size:14px;font-family:var(--font-display);letter-spacing:1px;cursor:pointer" disabled>Send my choices to Roberto’s</button>'+
      '<div id="alc-msg" style="font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:7px">Tick a dish to send your choices.</div></div>'+
      '</div>';
  }

  if(bevs.length){
    h += '<div class="sect">'+(both ? '<div class="sect-t">Beverage packages</div>' : '')+
      bevs.map(function(b){
        return '<div class="item"><div class="nm">'+esc(b.name)+'</div>'+
          ((noPrice || b.price_pp==null)
            ? (b.duration_hours ? '<div class="pr">'+b.duration_hours+' hours</div>' : '')
            : '<div class="pr">'+(b.duration_hours ? b.duration_hours+' hours · ' : '')+'AED '+money(b.price_pp)+' per guest</div>')+
          (b.includes ? '<span class="ds">'+esc(b.includes)+'</span>' : '')+
          (b.pdf ? '<a class="open" href="'+esc(b.pdf)+'" target="_blank" rel="noopener">View the beverage package</a>' : '')+'</div>';
      }).join('')+'</div>';
  }

  h += '<div class="btnrow"><div class="ft">To book your occasion or ask us anything, simply reply to Valentina — or write to '+
    '<a href="mailto:reservations@robertos.ae" style="color:var(--vino)">reservations@robertos.ae</a>.<br><br>'+
    (noPrice ? '' : 'All prices are in AED and inclusive of 5% VAT, 7% DIFC Authority Fee and 10% Service Charge.<br>')+
    'Our chefs will do their best to accommodate your dietary requirements.</div></div>';
  el('card').innerHTML = h;
}
load();
</script>
</body>
</html>
